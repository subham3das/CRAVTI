<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cravity - Register</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. THEME --- */
        :root {
            --bg: #000;
            --primary: #FF3F3F;
            --neon-blue: #00F0FF;
            --gold: #FFD700;
            --success: #00E676;
            --border: rgba(255, 255, 255, 0.15);
            --text: #FFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #000; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text);
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 414px; height: 100%; position: relative;
            background: radial-gradient(circle at 50% 0%, #1a0505 0%, #000 80%);
            display: flex; flex-direction: column; justify-content: center; padding: 30px;
        }

        /* Background Grid */
        .grid-bg {
            position: absolute; inset: 0; opacity: 0.2; pointer-events: none;
            background-image: linear-gradient(rgba(255, 63, 63, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 63, 63, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle, black 30%, transparent 80%);
        }

        /* --- 2. HEADER --- */
        .brand-section { text-align: left; margin-bottom: 30px; position: relative; z-index: 2; }
        .title {
            font-family: 'JetBrains Mono'; font-weight: 800; font-size: 32px; letter-spacing: -1px;
            color: white; text-shadow: 0 0 20px var(--primary); margin-bottom: 5px;
        }
        .subtitle { font-size: 12px; color: #888; letter-spacing: 1px; text-transform: uppercase; }

        /* --- 3. FORM --- */
        .form-box { position: relative; z-index: 2; }
        
        .input-box { position: relative; margin-bottom: 25px; }
        
        .t-input {
            width: 100%; background: transparent; border: none; border-bottom: 1px solid #333;
            padding: 15px 40px 15px 0; color: white; font-size: 16px; outline: none;
            font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s;
        }
        .t-input:focus { border-bottom-color: var(--neon-blue); padding-left: 10px; }
        
        .t-label {
            position: absolute; left: 0; top: 15px; color: #666; font-size: 14px;
            transition: 0.3s; pointer-events: none; font-family: 'JetBrains Mono';
        }
        .t-input:focus ~ .t-label,
        .t-input:not(:placeholder-shown) ~ .t-label {
            top: -10px; font-size: 10px; color: var(--neon-blue); left: 0;
        }

        .input-icon {
            position: absolute; right: 0; top: 15px; color: #444; font-size: 20px; transition: 0.3s;
        }
        .t-input:focus ~ .input-icon { color: var(--text); }

        /* --- 4. WAITLIST CODE (INTERACTIVE) --- */
        .code-wrapper {
            position: relative; border-bottom: 1px solid #333; transition: 0.5s;
            margin-bottom: 25px;
        }
        .code-container { display: flex; align-items: baseline; }
        
        .fixed-prefix {
            font-family: 'JetBrains Mono'; color: #666; font-size: 18px; font-weight: 700;
            padding: 15px 0 15px 0; margin-right: 5px; letter-spacing: 1px; transition: 0.3s;
        }
        .code-input {
            flex: 1; background: transparent; border: none; 
            color: white; font-size: 18px; outline: none; letter-spacing: 5px;
            font-family: 'JetBrains Mono'; padding: 15px 0;
        }
        .code-status-icon {
            position: absolute; right: 0; top: 15px; color: #444; transition: 0.3s;
        }

        /* VIP Unlocked State (Gold Theme) */
        .code-wrapper.vip-active { border-bottom-color: var(--gold); box-shadow: 0 5px 10px -5px rgba(255, 215, 0, 0.3); }
        .code-wrapper.vip-active .fixed-prefix { color: var(--gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .code-wrapper.vip-active .code-input { color: var(--gold); }
        .code-wrapper.vip-active .code-status-icon { color: var(--gold); transform: scale(1.2); }

        .vip-badge {
            position: absolute; top: -15px; right: 0; background: var(--gold); color: black;
            font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
            opacity: 0; transform: translateY(10px); transition: 0.3s; pointer-events: none;
        }
        .code-wrapper.vip-active .vip-badge { opacity: 1; transform: translateY(0); }

        /* --- 5. TERMS TOGGLE (FIXED) --- */
        .terms-box { 
            display: flex; align-items: center; gap: 15px; margin: 30px 0; 
            cursor: pointer; transition: 0.2s; border-radius: 8px; padding: 5px; 
            user-select: none; /* Prevents text selection on click */
        }
        
        .cyber-check {
            width: 24px; height: 24px; border: 2px solid #444; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
            background: transparent;
        }
        
        /* Checkbox Active State */
        .cyber-check.checked { 
            border-color: var(--success); 
            background: rgba(0, 230, 118, 0.1); 
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.3); 
        }
        
        /* The Tick Icon Animation */
        .cyber-check span { 
            font-size: 18px; color: var(--success); 
            opacity: 0; transform: scale(0); 
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .cyber-check.checked span { opacity: 1; transform: scale(1); }

        /* Error Shake Animation */
        .shake { animation: shake 0.4s ease-in-out; border: 1px solid var(--primary); background: rgba(255, 63, 63, 0.1); }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .terms-text { font-size: 12px; color: #888; line-height: 1.4; }
        .highlight { color: white; font-weight: 700; border-bottom: 1px dotted #666; }

        /* --- 6. ACTION BUTTON --- */
        .signup-btn {
            width: 100%; height: 55px; border-radius: 15px; border: none;
            background: var(--text); color: black; font-weight: 800; font-size: 16px;
            cursor: pointer; box-shadow: 0 0 20px rgba(255,255,255,0.2); letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .signup-btn:active { transform: scale(0.98); }
        
        .signup-btn.loading span { display: none; }
        .signup-btn.loading::after {
            content: ''; width: 20px; height: 20px; border: 3px solid black; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }

        /* --- 7. FOOTER --- */
        .footer { text-align: center; margin-top: 30px; position: relative; z-index: 2; }
        .login-link { color: #666; font-size: 12px; text-decoration: none; font-family: 'JetBrains Mono'; }
        .login-link span { color: var(--neon-blue); font-weight: 700; }

        /* --- 8. TOAST NOTIFICATION --- */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px); border: 1px solid #333;
            color: white; padding: 12px 24px; border-radius: 50px; font-size: 12px; font-weight: bold;
            z-index: 1000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: max-content;
        }
        .toast.active { transform: translateX(-50%) translateY(0); }
        .toast.gold { border-color: var(--gold); color: var(--gold); }
        .toast.red { border-color: var(--primary); color: var(--primary); }

        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="toast" id="toast">
        <span class="material-icons-round" id="toast-icon">info</span>
        <span id="toast-msg">Notification</span>
    </div>

    <div class="app-container">
        <div class="grid-bg"></div>

        <div class="brand-section">
            <div class="title">NEW ID</div>
            <div class="subtitle">INITIALIZE PROTOCOL</div>
        </div>

        <div class="form-box">
            
            <div class="input-box">
                <input type="text" class="t-input" id="name" placeholder=" " required>
                <label class="t-label">FULL DESIGNATION</label>
                <span class="material-icons-round input-icon">badge</span>
            </div>

            <div class="input-box">
                <input type="email" class="t-input" id="email" placeholder=" " required>
                <label class="t-label">CONTACT UPLINK</label>
                <span class="material-icons-round input-icon">alternate_email</span>
            </div>

            <div class="input-box">
                <input type="password" class="t-input" id="password" placeholder=" " required>
                <label class="t-label">SECURE KEY</label>
                <span class="material-icons-round input-icon">vpn_key</span>
            </div>

            <div class="code-wrapper" id="vip-wrapper">
                <span class="vip-badge">VIP UNLOCKED</span>
                <div class="code-container">
                    <span class="fixed-prefix">808-</span>
                    <input type="tel" class="code-input" id="waitlist-code" placeholder="XXXXXX" maxlength="6" pattern="\d*" oninput="checkCode()">
                </div>
                <span class="material-icons-round code-status-icon" id="vip-icon">lock</span>
                <label class="t-label" style="top:-10px; font-size:10px; color:#666;">WAITLIST TOKEN (OPTIONAL)</label>
            </div>

            <div class="terms-box" id="terms-container" onclick="toggleTerms()">
                <div class="cyber-check" id="terms-check">
                    <span class="material-icons-round">check</span>
                </div>
                <div class="terms-text">
                    I accept the <span class="highlight">Terms of Service</span> and <span class="highlight">Privacy Protocol</span>.
                </div>
            </div>

            <button class="signup-btn" id="main-btn" onclick="register()">
                <span>CREATE ACCESS</span> <span class="material-icons-round">arrow_forward</span>
            </button>

        </div>

        <div class="footer">
            <a href="login.html" class="login-link">EXISTING USER? <span>LOGIN</span></a>
        </div>

    </div>

    <script>
        let termsAccepted = false;
        let isVip = false;

        function toggleTerms() {
            // Updated IDs to match HTML structure
            const checkbox = document.getElementById('terms-check');
            const container = document.getElementById('terms-container');
            
            termsAccepted = !termsAccepted;
            
            if(termsAccepted) {
                checkbox.classList.add('checked');
                container.classList.remove('shake'); // Remove error style if present
            } else {
                checkbox.classList.remove('checked');
            }
            if(navigator.vibrate) navigator.vibrate(20);
        }

        function checkCode() {
            const input = document.getElementById('waitlist-code');
            const wrapper = document.getElementById('vip-wrapper');
            const icon = document.getElementById('vip-icon');

            if(input.value.length === 6) {
                // Success State
                wrapper.classList.add('vip-active');
                icon.innerText = "lock_open";
                isVip = true;
                if(navigator.vibrate) navigator.vibrate([50, 50]);
            } else {
                // Default State
                wrapper.classList.remove('vip-active');
                icon.innerText = "lock";
                isVip = false;
            }
        }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const text = document.getElementById('toast-msg');
            
            text.innerText = msg;
            t.className = "toast"; // reset classes
            
            if(type === 'gold') {
                t.classList.add('gold');
                icon.innerText = "stars";
            } else if (type === 'red') {
                t.classList.add('red');
                icon.innerText = "warning";
            } else {
                icon.innerText = "info";
            }

            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 3000);
        }

        function register() {
            const btn = document.getElementById('main-btn');
            
            // 1. Check Terms
            if(!termsAccepted) {
                const container = document.getElementById('terms-container');
                container.classList.add('shake');
                if(navigator.vibrate) navigator.vibrate(200);
                setTimeout(() => container.classList.remove('shake'), 400);
                return;
            }

            // 2. Determine User Type
            if(isVip) {
                showToast("VIP ACCESS GRANTED: Perks Unlocked!", "gold");
                btn.style.background = "var(--gold)";
                btn.style.color = "black";
            } else {
                // The "Note that missed something" logic
                showToast("Standard Account Created. (Enter Token for VIP)", "red");
            }

            // 3. Process Logic
            btn.classList.add('loading');
            
            setTimeout(() => {
                // Save data
                if(isVip) localStorage.setItem('user_tier', 'VIP');
                window.location.href = 'home.html';
            }, 2500);
        }
    </script>

</body>
</html>
