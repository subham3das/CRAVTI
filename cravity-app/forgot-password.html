<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cravity - Recovery</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- THEME --- */
        :root {
            --bg: #000;
            --primary: #FF3F3F;
            --neon-blue: #00F0FF;
            --success: #00E676;
            --border: rgba(255, 255, 255, 0.15);
            --text: #FFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #000; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text);
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 414px; height: 100%; position: relative;
            background: radial-gradient(circle at 50% 100%, #1a0505 0%, #000 80%);
            display: flex; flex-direction: column; padding: 30px;
        }

        /* Background Grid */
        .grid-bg {
            position: absolute; inset: 0; opacity: 0.15; pointer-events: none;
            background-image: linear-gradient(#333 1px, transparent 1px),
            linear-gradient(90deg, #333 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle, black 40%, transparent 90%);
        }

        /* --- CONTENT --- */
        .header { margin-bottom: 40px; position: relative; z-index: 2; }
        .back-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            margin-bottom: 20px; transition: 0.2s;
        }
        .back-btn:active { background: white; color: black; }

        .lock-icon {
            font-size: 60px; color: var(--primary); margin-bottom: 15px;
            text-shadow: 0 0 30px var(--primary); animation: float 3s ease-in-out infinite;
        }
        
        .title { font-family: 'JetBrains Mono'; font-size: 24px; font-weight: 800; margin-bottom: 10px; color: white; }
        .desc { font-size: 14px; color: #888; line-height: 1.5; }

        /* --- FORM --- */
        .form-box { position: relative; z-index: 2; margin-top: 20px; }
        
        .input-group { position: relative; margin-bottom: 30px; }
        .t-input {
            width: 100%; background: transparent; border: none; border-bottom: 1px solid #333;
            padding: 15px 0; color: white; font-size: 18px; outline: none;
            font-family: 'JetBrains Mono'; transition: 0.3s;
        }
        .t-input:focus { border-bottom-color: var(--neon-blue); }
        .t-label {
            position: absolute; left: 0; top: 15px; color: #666; font-size: 12px;
            transition: 0.3s; pointer-events: none; font-family: 'JetBrains Mono'; letter-spacing: 1px;
        }
        .t-input:focus ~ .t-label, .t-input:not(:placeholder-shown) ~ .t-label {
            top: -10px; font-size: 10px; color: var(--neon-blue);
        }

        .recover-btn {
            width: 100%; height: 55px; border-radius: 15px; border: none;
            background: white; color: black; font-weight: 800; font-size: 14px;
            cursor: pointer; box-shadow: 0 0 20px rgba(255,255,255,0.2); letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .recover-btn:active { transform: scale(0.98); background: var(--primary); color: white; box-shadow: 0 0 30px var(--primary); }

        /* --- SUCCESS OVERLAY --- */
        .success-overlay {
            position: absolute; inset: 0; background: #000; z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        .mail-icon {
            font-size: 80px; color: var(--success); margin-bottom: 20px;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .success-title { font-family: 'JetBrains Mono'; font-size: 20px; color: white; margin-bottom: 10px; }
        .success-desc { color: #888; font-size: 12px; max-width: 80%; }

        /* Animations */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes scan { 0% { width: 0%; } 100% { width: 100%; } }

        /* Loading Bar inside button */
        .btn-loader {
            position: absolute; left: 0; top: 0; height: 100%; width: 0%;
            background: var(--neon-blue); opacity: 0.3; transition: width 2s ease-in-out;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="grid-bg"></div>

        <div class="header">
            <div class="back-btn" onclick="window.history.back()">
                <span class="material-icons-round">arrow_back</span>
            </div>
            <span class="material-icons-round lock-icon" id="lock">lock_reset</span>
            <div class="title">RECOVERY_MODE</div>
            <div class="desc">Enter your registered ID. We will send a secure link to re-establish access.</div>
        </div>

        <div class="form-box">
            <div class="input-group">
                <input type="email" class="t-input" id="email" placeholder=" " required>
                <label class="t-label">ENTER EMAIL ADDRESS</label>
            </div>

            <button class="recover-btn" onclick="sendRecovery()">
                <div class="btn-loader" id="loader"></div>
                <span style="position:relative; z-index:2">INITIATE SEQUENCE</span>
            </button>
        </div>

        <div class="success-overlay" id="success">
            <span class="material-icons-round mail-icon">mark_email_read</span>
            <div class="success-title">LINK ESTABLISHED</div>
            <div class="success-desc">A recovery protocol has been sent to your inbox.</div>
            <button class="recover-btn" style="margin-top:40px; width:auto; padding:0 30px;" onclick="window.location.href='login.html'">RETURN TO LOGIN</button>
        </div>

    </div>

    <script>
        function sendRecovery() {
            const email = document.getElementById('email').value;
            const btn = document.querySelector('.recover-btn span');
            const loader = document.getElementById('loader');
            const lock = document.getElementById('lock');

            if (!email) {
                alert("Please enter an email.");
                return;
            }

            if(navigator.vibrate) navigator.vibrate(20);

            // Animation Sequence
            btn.innerText = "SEARCHING DATABASE...";
            loader.style.width = "100%"; // Fill bar

            // Unlock Icon Animation
            setTimeout(() => {
                lock.innerText = "lock_open";
                lock.style.color = "var(--success)";
                lock.style.textShadow = "0 0 30px var(--success)";
                if(navigator.vibrate) navigator.vibrate([50, 50]);
            }, 1500);

            // Show Success Screen
            setTimeout(() => {
                document.getElementById('success').style.display = 'flex';
            }, 2200);
        }
    </script>

</body>
</html>
