<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cravity - Contact</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. CORE THEME --- */
        :root {
            --bg: #000;
            --glass: rgba(20, 20, 20, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #FF3F3F;
            --neon-blue: #00F0FF;
            --success: #00E676;
            --text: #FFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #000; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text);
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 414px; height: 100%; position: relative;
            background: radial-gradient(circle at 50% 0%, #111 0%, #000 80%);
            overflow-y: scroll; scroll-behavior: smooth; scrollbar-width: none; 
        }
        .app-container::-webkit-scrollbar { display: none; }

        /* --- 2. HEADER --- */
        header {
            padding: 25px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 20; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }
        .icon-glass {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border); color: white; cursor: pointer; transition: 0.2s;
        }
        .icon-glass:active { transform: scale(0.9); background: white; color: black; }
        .page-title { font-size: 12px; font-family: 'JetBrains Mono'; letter-spacing: 2px; color: #888; font-weight: 800; }

        /* --- 3. SYSTEM STATUS --- */
        .status-card {
            margin: 10px 25px 30px 25px; padding: 15px; border-radius: 15px;
            background: rgba(0, 230, 118, 0.05); border: 1px solid var(--success);
            display: flex; align-items: center; justify-content: space-between;
        }
        .status-info h4 { font-size: 14px; color: var(--success); margin-bottom: 2px; }
        .status-info p { font-size: 10px; color: #aaa; font-family: 'JetBrains Mono'; }
        .pulse-dot {
            width: 10px; height: 10px; background: var(--success); border-radius: 50%;
            box-shadow: 0 0 10px var(--success); animation: pulse 1.5s infinite;
        }

        /* --- 4. CONTACT GRID --- */
        .contact-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 0 25px; margin-bottom: 30px;
        }
        .contact-item {
            background: var(--glass); border: 1px solid var(--border); border-radius: 15px;
            padding: 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .contact-item:active { background: rgba(255,255,255,0.1); border-color: var(--neon-blue); }
        .ci-icon { font-size: 24px; margin-bottom: 8px; color: white; }
        .ci-label { font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; }

        /* --- 5. TRANSMISSION FORM --- */
        .form-section { padding: 0 25px 100px 25px; }
        .section-title { font-family: 'JetBrains Mono'; font-size: 12px; color: var(--primary); margin-bottom: 15px; display: block;}
        
        .input-group { margin-bottom: 20px; }
        .input-label { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 1px; }
        
        .tech-input {
            width: 100%; background: #0a0a0a; border: 1px solid var(--border);
            padding: 15px; color: white; border-radius: 12px; outline: none; font-size: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s;
        }
        .tech-input:focus { border-color: var(--neon-blue); background: rgba(0, 240, 255, 0.05); box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); }
        
        /* Submit Button */
        .transmit-btn {
            width: 100%; padding: 18px; border-radius: 15px; border: none;
            background: var(--text); color: black; font-weight: 800; font-size: 14px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .transmit-btn:active { transform: scale(0.98); }
        
        /* Progress Bar inside button (Hidden) */
        .btn-progress {
            position: absolute; left: 0; top: 0; height: 100%; width: 0%;
            background: var(--success); z-index: 0; transition: width 2s ease-in-out;
        }
        .btn-text { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; }

        /* --- 6. SUCCESS OVERLAY --- */
        .success-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.5s;
        }
        .success-overlay.active { opacity: 1; pointer-events: auto; }
        
        .check-circle {
            width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--success);
            display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
            box-shadow: 0 0 30px var(--success);
        }
        .success-text { font-family: 'JetBrains Mono'; color: var(--success); font-size: 14px; letter-spacing: 2px; margin-top: 10px; }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        
    </style>
</head>
<body>

    <div class="app-container">
        
        <header>
            <div class="icon-glass" onclick="window.history.back()"><span class="material-icons-round">arrow_back</span></div>
            <div class="page-title">UPLINK</div>
            <div style="width:40px"></div>
        </header>

        <div class="status-card">
            <div class="status-info">
                <h4>SYSTEM ONLINE</h4>
                <p>Avg Response: &lt; 2 Mins</p>
            </div>
            <div class="pulse-dot"></div>
        </div>

        <div class="contact-grid">
            <div class="contact-item" onclick="alert('Opening Live Chat...')">
                <span class="material-icons-round ci-icon" style="color:var(--neon-blue)">chat</span>
                <span class="ci-label">Live Chat</span>
            </div>
            <div class="contact-item" onclick="window.location.href='mailto:support@cravity.app'">
                <span class="material-icons-round ci-icon" style="color:var(--primary)">mail</span>
                <span class="ci-label">Email</span>
            </div>
            <div class="contact-item" onclick="alert('Opening FAQ Database...')">
                <span class="material-icons-round ci-icon" style="color:#FFD700">help</span>
                <span class="ci-label">FAQ DB</span>
            </div>
        </div>

        <div class="form-section">
            <span class="section-title">ENCRYPTED MESSAGE</span>
            
            <div class="input-group">
                <label class="input-label">Subject</label>
                <input type="text" class="tech-input" placeholder="Missing Item / Issue...">
            </div>

            <div class="input-group">
                <label class="input-label">Data Payload</label>
                <textarea class="tech-input" rows="5" placeholder="Describe your issue..."></textarea>
            </div>

            <button class="transmit-btn" id="send-btn" onclick="transmitData()">
                <div class="btn-progress" id="progress"></div>
                <span class="btn-text" id="btn-txt">
                    <span class="material-icons-round">send</span> TRANSMIT
                </span>
            </button>
        </div>

        <div class="success-overlay" id="success">
            <div class="check-circle">
                <span class="material-icons-round" style="font-size:40px; color:var(--success)">check</span>
            </div>
            <h2 style="color:white;">SENT</h2>
            <div class="success-text">TICKET #9928 CREATED</div>
            <button class="transmit-btn" style="margin-top:30px; background:#333; color:white; width:auto; padding:10px 30px;" onclick="window.history.back()">CLOSE</button>
        </div>

    </div>

    <script>
        function transmitData() {
            const btn = document.getElementById('send-btn');
            const progress = document.getElementById('progress');
            const txt = document.getElementById('btn-txt');

            if(navigator.vibrate) navigator.vibrate(50);

            // Animation
            txt.innerHTML = "UPLOADING...";
            progress.style.width = "100%";

            setTimeout(() => {
                document.getElementById('success').classList.add('active');
                if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
            }, 2000);
        }
    </script>

</body>
</html>
