<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRAVITI - Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --brand-orange: #FF5E3A;
            --brand-yellow: #FFC107;
            --brand-brown: #3E1E1E;
            --text: #FFF;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg-dark);
            height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px; /* For 3D effects */
        }

        #splash-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, #1a0505 0%, #000000 90%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            overflow: hidden;
        }

        /* --- THE VORTEX (Background Lines) --- */
        .vortex-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            transform-style: preserve-3d;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 100px;
            background: linear-gradient(to bottom, transparent, var(--brand-orange), transparent);
            top: 50%;
            left: 50%;
            transform-origin: center center;
            opacity: 0;
            animation: warpSpeed 2s linear infinite;
        }

        /* --- LOGO CONTAINER --- */
        .logo-box {
            position: relative;
            z-index: 10;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: slamIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Glowing Pulse behind logo */
        .logo-box::before {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: var(--brand-orange);
            filter: blur(40px);
            opacity: 0.4;
            animation: erraticPulse 0.2s infinite alternate;
        }

        .main-logo {
            width: 100%;
            height: auto;
            z-index: 20;
            filter: drop-shadow(0 0 15px rgba(255, 94, 58, 0.6));
            /* A slight hover float */
            animation: floatCrazy 3s ease-in-out infinite; 
        }

        /* --- TYPOGRAPHY --- */
        .text-box {
            margin-top: 30px;
            z-index: 10;
            text-align: center;
            mix-blend-mode: hard-light;
        }

        .title {
            font-size: 48px;
            font-weight: 900;
            color: white;
            letter-spacing: -2px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            transform: scale(0);
            animation: textPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s forwards;
        }

        /* Glitch Layers */
        .title::after, .title::before {
            content: 'CRAVITI';
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            opacity: 0.5;
        }
        .title::before {
            color: var(--brand-neon);
            z-index: -1;
            text-shadow: 2px 0 var(--brand-yellow);
            animation: glitch-anim-1 0.4s infinite linear alternate-reverse;
        }
        .title::after {
            color: var(--brand-orange);
            z-index: -2;
            text-shadow: -2px 0 blue;
            animation: glitch-anim-2 0.4s infinite linear alternate-reverse;
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: var(--brand-yellow);
            letter-spacing: 6px;
            margin-top: 5px;
            opacity: 0;
            animation: fadeIn 0.5s ease 1s forwards;
        }

        /* --- LOADING SPINNER (Unique Ring) --- */
        .orbit-loader {
            position: absolute;
            bottom: 50px;
            width: 50px;
            height: 50px;
            z-index: 10;
        }
        .orbit {
            position: absolute;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
        .orbit:nth-child(1) {
            border-bottom: 3px solid var(--brand-orange);
            animation: spin1 1s linear infinite;
        }
        .orbit:nth-child(2) {
            border-right: 3px solid var(--brand-yellow);
            animation: spin2 1s linear infinite;
        }
        .orbit:nth-child(3) {
            border-top: 3px solid white;
            animation: spin3 1s linear infinite;
        }

        /* --- EXIT ANIMATIONS --- */
        .warp-out .logo-box {
            animation: blackHoleSuck 0.8s ease-in forwards;
        }
        
        .warp-out .text-box, .warp-out .orbit-loader {
            opacity: 0;
            transition: 0.3s;
        }

        .warp-out .star {
            /* Stars stretch infinitely during jump */
            height: 1000px;
            background: white;
            opacity: 1;
            transition: 0.5s;
        }

        .white-flash {
            position: fixed; inset: 0; background: white; z-index: 10000;
            opacity: 0; pointer-events: none;
        }
        .warp-out .white-flash {
            animation: flashBang 0.8s ease-in forwards 0.6s;
        }

        /* --- KEYFRAMES --- */
        @keyframes warpSpeed {
            0% { transform: translate(-50%, -50%) rotate(var(--angle)) translateY(0) scaleY(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -50%) rotate(var(--angle)) translateY(500px) scaleY(3); opacity: 0; }
        }

        @keyframes slamIn {
            0% { transform: scale(3); opacity: 0; }
            50% { transform: scale(0.8); opacity: 1; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes floatCrazy {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(5deg) translateY(-10px); }
            75% { transform: rotate(-5deg) translateY(10px); }
        }

        @keyframes erraticPulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.2); opacity: 0.6; }
        }

        @keyframes textPop {
            to { transform: scale(1); }
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* Glitch Keyframes */
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 2px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -2px); }
            40% { clip-path: inset(10% 0 50% 0); transform: translate(2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, -2px); }
            80% { clip-path: inset(30% 0 40% 0); transform: translate(2px, 2px); }
            100% { clip-path: inset(50% 0 30% 0); transform: translate(-2px, -2px); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -2px); }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 2px); }
            40% { clip-path: inset(30% 0 20% 0); transform: translate(2px, 2px); }
            60% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, -2px); }
            80% { clip-path: inset(40% 0 10% 0); transform: translate(2px, 2px); }
            100% { clip-path: inset(50% 0 30% 0); transform: translate(-2px, -2px); }
        }

        /* Loaders */
        @keyframes spin1 { 0% { transform: rotateX(35deg) rotateY(-45deg) rotateZ(0deg); } 100% { transform: rotateX(35deg) rotateY(-45deg) rotateZ(360deg); } }
        @keyframes spin2 { 0% { transform: rotateX(50deg) rotateY(10deg) rotateZ(0deg); } 100% { transform: rotateX(50deg) rotateY(10deg) rotateZ(360deg); } }
        @keyframes spin3 { 0% { transform: rotateX(35deg) rotateY(55deg) rotateZ(0deg); } 100% { transform: rotateX(35deg) rotateY(55deg) rotateZ(360deg); } }

        /* EXIT: Black Hole Suck */
        @keyframes blackHoleSuck {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            50% { transform: scale(1.5) rotate(180deg); filter: brightness(2); }
            100% { transform: scale(0) rotate(720deg); filter: brightness(50); }
        }

        @keyframes flashBang {
            0% { opacity: 0; }
            50% { opacity: 1; background: var(--brand-orange); }
            100% { opacity: 1; background: white; }
        }

    </style>
</head>
<body>

    <div id="splash-screen">
        
        <div class="vortex-container" id="starfield"></div>

        <div class="logo-box">
            <img src="IMAGE/logo.png" alt="Craviti Logo" class="main-logo">
        </div>

        <div class="text-box">
            <div class="title">CRAVITI</div>
            <div class="subtitle">GET CRAZY. GET FED.</div>
        </div>

        <div class="orbit-loader">
            <div class="orbit"></div>
            <div class="orbit"></div>
            <div class="orbit"></div>
        </div>

        <div class="white-flash"></div>

    </div>

    <script>
        // 1. Generate "Crazy" Warp Stars
        const starfield = document.getElementById('starfield');
        const starCount = 30; // Number of lines

        for(let i=0; i<starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            // Random angle for explosion effect
            const angle = Math.random() * 360;
            // Random delay so they don't all start at once
            const delay = Math.random() * 2;
            const duration = 1 + Math.random(); // 1 to 2 seconds
            
            star.style.setProperty('--angle', angle + 'deg');
            star.style.animationDelay = delay + 's';
            star.style.animationDuration = duration + 's';
            starfield.appendChild(star);
        }

        // 2. Animation Sequence
        window.onload = () => {
            const splash = document.getElementById('splash-screen');

            setTimeout(() => {
                // Trigger Exit Sequence (Warp Out)
                splash.classList.add('warp-out');
                
                // Aggressive Haptic Feedback
                if(navigator.vibrate) navigator.vibrate([50, 30, 50, 30, 100]);

                // Redirect after black hole effect
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1200); // 1.2s exit duration

            }, 3000); // Stay on splash for 3 seconds
        };
    </script>

</body>
</html>
