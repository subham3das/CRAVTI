<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cravity - Loyalty</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. CORE THEME --- */
        :root {
            --bg: #000;
            --card-glass: rgba(30, 30, 30, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #FF3F3F;
            --success: #00E676;
            --gold: #FFD700;
            --text: #FFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background: #000; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text);
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 414px; height: 100%; position: relative;
            background: radial-gradient(circle at 50% 0%, #1a0505 0%, #000 80%);
            display: flex; flex-direction: column;
        }

        /* --- 2. HEADER --- */
        header {
            padding: 25px; display: flex; align-items: center; justify-content: space-between;
            z-index: 20;
        }
        .back-btn {
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .page-title { font-size: 16px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

        /* --- 3. THE PREMIUM CARD --- */
        .card-stage {
            padding: 10px 25px; perspective: 1000px; z-index: 10;
        }
        
        .loyalty-card {
            width: 100%; height: 220px; border-radius: 25px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; justify-content: space-between; padding: 25px;
            position: relative; overflow: hidden; transition: transform 0.1s; transform-style: preserve-3d;
        }

        /* Card Header */
        .c-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .brand-info h2 { font-size: 20px; font-weight: 800; margin-bottom: 2px; }
        .brand-info p { font-size: 11px; color: #aaa; }
        .progress-badge {
            background: var(--primary); padding: 5px 10px; border-radius: 12px;
            font-family: 'JetBrains Mono'; font-weight: 800; font-size: 12px;
            box-shadow: 0 0 15px rgba(255, 63, 63, 0.4);
        }

        /* Stamp Grid */
        .stamp-grid {
            display: flex; justify-content: space-between; margin-top: 15px;
        }
        .stamp-row { display: flex; gap: 8px; }
        
        .stamp {
            width: 32px; height: 32px; border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #555; transition: 0.3s;
        }
        
        /* Active Stamp */
        .stamp.filled {
            border: none; background: white; color: var(--primary);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            transform: scale(1.1); font-weight: 900;
        }
        
        /* Reward Stamp */
        .stamp.reward { border-color: var(--gold); color: var(--gold); }
        .stamp.reward i { font-size: 14px; }
        .stamp.reward.unlocked {
            background: var(--gold); color: black; box-shadow: 0 0 20px var(--gold);
            animation: pulse-gold 2s infinite; border: none;
        }

        .c-bottom { display: flex; justify-content: space-between; align-items: flex-end; font-size: 10px; color: #888; font-family: 'JetBrains Mono'; }

        /* --- 4. ACTION BUTTON --- */
        .action-area { padding: 30px 25px; }
        
        .scan-btn {
            width: 100%; padding: 18px; border-radius: 20px; border: none;
            background: linear-gradient(90deg, var(--primary), #FF0055);
            color: white; font-weight: 800; font-size: 16px; letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; box-shadow: 0 10px 30px rgba(255, 63, 63, 0.3);
            transition: 0.2s;
        }
        .scan-btn:active { transform: scale(0.98); }

        /* Redeem State */
        .scan-btn.redeem {
            background: var(--gold); color: black; box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }

        /* --- 5. HISTORY LIST --- */
        .history-section { flex: 1; padding: 0 25px; overflow-y: auto; }
        .h-label { font-size: 12px; font-weight: 700; color: #666; margin-bottom: 15px; text-transform: uppercase; }
        
        .h-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px; background: rgba(255,255,255,0.03); border-radius: 15px;
            margin-bottom: 10px; border: 1px solid var(--border);
        }
        .h-left { display: flex; align-items: center; gap: 12px; }
        .h-icon {
            width: 35px; height: 35px; border-radius: 10px; background: rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center; color: #aaa;
        }
        .h-info h4 { font-size: 14px; margin-bottom: 2px; }
        .h-info p { font-size: 10px; color: #666; }
        .h-points { font-family: 'JetBrains Mono'; font-weight: 700; color: var(--success); }

        /* --- 6. SCANNER OVERLAY --- */
        .scan-overlay {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: none; align-items: center; justify-content: center; flex-direction: column;
        }
        .scan-frame {
            width: 260px; height: 260px; border: 2px solid #333; border-radius: 40px;
            position: relative; overflow: hidden; box-shadow: 0 0 100px rgba(255, 63, 63, 0.1);
            background: url('https://images.unsplash.com/photo-1550989460-0adf9ea622e2?w=600&q=80') center/cover;
        }
        .scan-laser {
            position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--primary); box-shadow: 0 0 20px var(--primary);
            animation: scan 1.5s infinite ease-in-out;
        }
        .scan-text { margin-top: 30px; color: white; font-weight: 700; letter-spacing: 2px; font-size: 12px; }
        .close-scan { 
            position: absolute; bottom: 50px; width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(10px);
        }

        /* Animations */
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
        @keyframes pulse-gold { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }

        /* Pop Class */
        .pop-anim { animation: pop 0.4s ease-out forwards; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <header>
            <div class="back-btn" onclick="window.history.back()"><span class="material-icons-round">arrow_back</span></div>
            <div class="page-title">Loyalty Card</div>
            <div style="width:45px"></div> </header>

        <div class="card-stage">
            <div class="loyalty-card" id="tilt-card">
                
                <div class="c-top">
                    <div class="brand-info">
                        <h2>Urban Grind</h2>
                        <p>Buy 9, Get 1 Free</p>
                    </div>
                    <div class="progress-badge" id="prog-text">80%</div>
                </div>

                <div class="stamp-grid">
                    <div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; width:100%;">
                        <div class="stamp filled">1</div>
                        <div class="stamp filled">2</div>
                        <div class="stamp filled">3</div>
                        <div class="stamp filled">4</div>
                        <div class="stamp filled">5</div>
                        
                        <div class="stamp filled">6</div>
                        <div class="stamp filled">7</div>
                        <div class="stamp filled">8</div>
                        <div class="stamp" id="stamp-9">9</div>
                        <div class="stamp reward" id="stamp-10"><span class="material-icons-round" style="font-size:14px">redeem</span></div>
                    </div>
                </div>

                <div class="c-bottom">
                    <span>ID: 9928-XA</span>
                    <span>EXP: NEVER</span>
                </div>

            </div>
        </div>

        <div class="action-area">
            <button class="scan-btn" id="main-btn" onclick="startScan()">
                <span class="material-icons-round" id="btn-icon">qr_code_scanner</span>
                <span id="btn-text">SCAN QR AT COUNTER</span>
            </button>
        </div>

        <div class="history-section">
            <div class="h-label">Recent Activity</div>
            <div id="history-list">
                <div class="h-item">
                    <div class="h-left">
                        <div class="h-icon"><span class="material-icons-round">local_cafe</span></div>
                        <div class="h-info"><h4>Latte</h4><p>Yesterday</p></div>
                    </div>
                    <div class="h-points">+1</div>
                </div>
                <div class="h-item">
                    <div class="h-left">
                        <div class="h-icon"><span class="material-icons-round">bakery_dining</span></div>
                        <div class="h-info"><h4>Croissant</h4><p>2 Days ago</p></div>
                    </div>
                    <div class="h-points">+1</div>
                </div>
            </div>
        </div>

    </div>

    <div class="scan-overlay" id="scanner">
        <div class="scan-frame"><div class="scan-laser"></div></div>
        <div class="scan-text">SCANNING...</div>
        <div class="close-scan" onclick="closeScan()"><span class="material-icons-round">close</span></div>
    </div>

    <script>
        let stamps = 8;
        const maxStamps = 10;

        // 1. SCAN LOGIC
        function startScan() {
            if (stamps >= maxStamps) {
                redeemReward();
                return;
            }

            const overlay = document.getElementById('scanner');
            overlay.style.display = 'flex';

            // Simulate successful scan after 2s
            setTimeout(() => {
                overlay.style.display = 'none';
                addStamp();
            }, 2000);
        }

        function closeScan() {
            document.getElementById('scanner').style.display = 'none';
        }

        // 2. ADD STAMP LOGIC
        function addStamp() {
            stamps++;
            updateUI();

            // Find the new stamp element and animate it
            const newStamp = document.querySelectorAll('.stamp')[stamps - 1];
            newStamp.classList.add('filled', 'pop-anim');
            
            // Add to history
            const history = document.getElementById('history-list');
            const newItem = `
                <div class="h-item pop-anim" style="border-color:var(--success)">
                    <div class="h-left">
                        <div class="h-icon" style="color:var(--success)"><span class="material-icons-round">check_circle</span></div>
                        <div class="h-info"><h4>New Visit</h4><p>Just Now</p></div>
                    </div>
                    <div class="h-points">+1</div>
                </div>`;
            history.insertAdjacentHTML('afterbegin', newItem);

            // Haptic
            if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
        }

        // 3. UPDATE UI STATE
        function updateUI() {
            // Update Badge
            const percent = (stamps / maxStamps) * 100;
            document.getElementById('prog-text').innerText = percent + '%';

            // Unlock Reward
            if (stamps === maxStamps) {
                const rewardStamp = document.getElementById('stamp-10');
                rewardStamp.classList.add('unlocked');
                rewardStamp.innerHTML = '<span class="material-icons-round">card_giftcard</span>';
                
                // Change Button
                const btn = document.getElementById('main-btn');
                btn.classList.add('redeem');
                document.getElementById('btn-text').innerText = "REDEEM FREE DRINK";
                document.getElementById('btn-icon').innerText = "stars";
            }
        }

        function redeemReward() {
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
            alert("🎉 REWARD CLAIMED!\nShow this code to the barista: CRAVE-FREE-99");
            
            // Reset (Optional for demo)
            stamps = 0;
            document.querySelectorAll('.stamp').forEach((el, index) => {
                el.classList.remove('filled', 'unlocked', 'pop-anim');
                if(index === 9) el.innerHTML = '<span class="material-icons-round" style="font-size:14px">redeem</span>';
            });
            
            const btn = document.getElementById('main-btn');
            btn.classList.remove('redeem');
            document.getElementById('btn-text').innerText = "SCAN QR AT COUNTER";
            document.getElementById('btn-icon').innerText = "qr_code_scanner";
            
            document.getElementById('prog-text').innerText = "0%";
        }

        // 4. 3D TILT EFFECT
        const card = document.getElementById('tilt-card');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const xRot = ((y - rect.height/2)/rect.height)*15;
            const yRot = ((x - rect.width/2)/rect.width)*-15;
            card.style.transform = `perspective(1000px) rotateX(${xRot}deg) rotateY(${yRot}deg)`;
        });
        card.addEventListener('mouseleave', () => card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)');
    </script>

</body>
</html>
