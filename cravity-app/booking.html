<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cravity - Reserve</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. CORE THEME --- */
        :root {
            --bg: #000;
            --glass: rgba(20, 20, 20, 0.75);
            --border: rgba(255, 255, 255, 0.15);
            --primary: #FF3F3F; /* Start Color (Red) */
            --success: #00E676; /* End Color (Green) */
            --text: #FFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #000; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text);
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 414px; height: 100%; position: relative;
            background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800&q=80');
            background-size: cover; background-position: center;
        }
        
        .overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 60%, #000 100%);
        }

        /* --- 2. HEADER --- */
        header {
            position: absolute; top: 0; left: 0; width: 100%; padding: 25px; z-index: 10;
            display: flex; justify-content: space-between;
        }
        .icon-glass {
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border); color: white; cursor: pointer; transition: 0.2s;
        }
        .icon-glass:active { transform: scale(0.9); background: white; color: black; }

        /* --- 3. RESTAURANT TITLE --- */
        .rest-title-area { position: absolute; top: 20%; left: 25px; z-index: 5; }
        .subtitle { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--primary); letter-spacing: 2px; margin-bottom: 5px; }
        h1 { font-size: 42px; font-weight: 800; line-height: 0.9; text-transform: uppercase; text-shadow: 0 10px 30px black; }

        /* --- 4. BOOKING CARD --- */
        .booking-card {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 65%;
            background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(25px);
            border-radius: 30px 30px 0 0; border-top: 1px solid var(--border);
            padding: 30px 25px 40px 25px; z-index: 20; overflow-y: auto;
            /* Hide Scrollbar */
            scrollbar-width: none;
        }
        .booking-card::-webkit-scrollbar { display: none; }

        .section-label { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; margin-top: 20px;}
        .section-label:first-child { margin-top: 0; }

        /* SCROLLERS (Date/Time/Guests) */
        .scroller {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;
            scrollbar-width: none; mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }
        .scroller::-webkit-scrollbar { display: none; }

        /* Date/Time Chips */
        .chip {
            min-width: 70px; height: 70px; border-radius: 18px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .chip:active { transform: scale(0.95); }
        .chip.active { background: white; color: black; border-color: white; box-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .chip-top { font-size: 10px; opacity: 0.6; font-weight: 700; text-transform: uppercase; }
        .chip-main { font-size: 18px; font-weight: 800; margin-top: 2px; }

        /* Guest Chips (Small Circles) */
        .guest-chip {
            min-width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .guest-chip.active { background: white; color: black; border-color: white; transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.2); }

        /* Seating */
        .seat-row { display: flex; gap: 10px; }
        .seat-opt {
            flex: 1; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--border); text-align: center; font-size: 12px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .seat-opt.active { border-color: var(--primary); color: var(--primary); background: rgba(255, 63, 63, 0.1); }

        /* --- 5. SLIDE TO CONFIRM (UPDATED) --- */
        .confirm-container {
            position: relative; width: 100%; height: 60px; background: #111;
            border-radius: 30px; overflow: hidden; margin-top: 30px; margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        
        /* The Text behind */
        .confirm-text {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; color: #555; letter-spacing: 2px; pointer-events: none;
            transition: opacity 0.2s;
        }
        
        /* The Color Fill that follows the knob */
        .slider-fill {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--primary), #FF00CC);
            border-radius: 30px 0 0 30px;
            transition: width 0.1s linear, background 0.3s;
            opacity: 0.5;
        }

        /* The Knob */
        .slider-knob {
            position: absolute; top: 5px; left: 5px; width: 50px; height: 50px;
            background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); 
            cursor: grab; transition: left 0.1s linear, background 0.3s; z-index: 5;
        }
        .slider-knob i { color: black; font-size: 24px; transition: 0.3s; }

        /* --- SUCCESS OVERLAY --- */
        .success-overlay {
            position: absolute; inset: 0; background: #000; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.5s;
        }
        .success-overlay.show { opacity: 1; pointer-events: auto; }
        .check-circle {
            width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--success);
            display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
            box-shadow: 0 0 30px var(--success); animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="overlay"></div>

        <header>
            <div class="icon-glass" onclick="window.history.back()"><span class="material-icons-round">close</span></div>
            <div class="icon-glass"><span class="material-icons-round">more_horiz</span></div>
        </header>

        <div class="rest-title-area">
            <div class="subtitle">RESERVATION</div>
            <h1>Taco<br>Haus</h1>
        </div>

        <div class="booking-card">
            
            <div class="section-label">Date</div>
            <div class="scroller">
                <div class="chip active" onclick="selectChip(this)"><span class="chip-top">TODAY</span><span class="chip-main">02</span></div>
                <div class="chip" onclick="selectChip(this)"><span class="chip-top">WED</span><span class="chip-main">03</span></div>
                <div class="chip" onclick="selectChip(this)"><span class="chip-top">THU</span><span class="chip-main">04</span></div>
                <div class="chip" onclick="selectChip(this)"><span class="chip-top">FRI</span><span class="chip-main">05</span></div>
                <div class="chip" onclick="selectChip(this)"><span class="chip-top">SAT</span><span class="chip-main">06</span></div>
            </div>

            <div class="section-label">Time</div>
            <div class="scroller">
                <div class="chip" onclick="selectChip(this)"><span class="chip-top">PM</span><span class="chip-main">06:00</span></div>
                <div class="chip active" onclick="selectChip(this)"><span class="chip-top">PM</span><span class="chip-main">07:30</span></div>
                <div class="chip" onclick="selectChip(this)"><span class="chip-top">PM</span><span class="chip-main">08:00</span></div>
                <div class="chip" onclick="selectChip(this)"><span class="chip-top">PM</span><span class="chip-main">09:00</span></div>
            </div>

            <div class="section-label">Guests</div>
            <div class="scroller">
                <div class="guest-chip" onclick="selectChip(this)">1</div>
                <div class="guest-chip active" onclick="selectChip(this)">2</div>
                <div class="guest-chip" onclick="selectChip(this)">3</div>
                <div class="guest-chip" onclick="selectChip(this)">4</div>
                <div class="guest-chip" onclick="selectChip(this)">5</div>
                <div class="guest-chip" onclick="selectChip(this)">6+</div>
            </div>

            <div class="section-label">Seating</div>
            <div class="seat-row">
                <div class="seat-opt active" onclick="selectSeat(this)"><span class="material-icons-round" style="font-size:16px">table_bar</span> Table</div>
                <div class="seat-opt" onclick="selectSeat(this)"><span class="material-icons-round" style="font-size:16px">weekend</span> Booth</div>
                <div class="seat-opt" onclick="selectSeat(this)"><span class="material-icons-round" style="font-size:16px">deck</span> Patio</div>
            </div>

            <div class="confirm-container" id="slider-track">
                <div class="slider-fill" id="fill"></div>
                <div class="confirm-text" id="slider-text">SLIDE TO CONFIRM</div>
                <div class="slider-knob" id="knob">
                    <span class="material-icons-round" id="knob-icon">chevron_right</span>
                </div>
            </div>

        </div>

        <div class="success-overlay" id="success">
            <div class="check-circle">
                <span class="material-icons-round" style="font-size:40px; color:var(--success);">check</span>
            </div>
            <h2 style="font-weight:800; font-size:24px; margin-bottom:5px;">CONFIRMED</h2>
            <p style="color:#888; font-size:14px;">Reservation ID: #8291</p>
            <button onclick="window.location.href='profile.html'" style="margin-top:40px; background:white; color:black; border:none; padding:12px 30px; border-radius:20px; font-weight:bold; cursor:pointer;">View Ticket</button>
        </div>

    </div>

    <script>
        // --- CHIP & SEAT LOGIC ---
        function selectChip(el) {
            el.parentNode.querySelectorAll('div').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            if(navigator.vibrate) navigator.vibrate(20);
        }

        function selectSeat(el) {
            document.querySelectorAll('.seat-opt').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            if(navigator.vibrate) navigator.vibrate(20);
        }

        // --- SLIDE ANIMATION LOGIC ---
        const knob = document.getElementById('knob');
        const track = document.getElementById('slider-track');
        const fill = document.getElementById('fill');
        const text = document.getElementById('slider-text');
        const icon = document.getElementById('knob-icon');
        
        let isDragging = false;
        let startX;

        // Events
        knob.addEventListener('touchstart', startDrag); knob.addEventListener('touchmove', drag); knob.addEventListener('touchend', endDrag);
        knob.addEventListener('mousedown', startDrag); window.addEventListener('mousemove', drag); window.addEventListener('mouseup', endDrag);

        function startDrag(e) {
            isDragging = true;
            startX = (e.touches ? e.touches[0].clientX : e.clientX) - knob.offsetLeft;
            knob.style.transition = 'none';
            fill.style.transition = 'none';
        }

        function drag(e) {
            if(!isDragging) return;
            e.preventDefault();
            let x = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
            let max = track.offsetWidth - knob.offsetWidth - 10; // 5px padding on each side
            
            if(x < 5) x = 5;
            if(x > max) x = max;
            
            // Move Knob
            knob.style.left = x + 'px';
            
            // Move Fill & Change Color
            let pct = (x / max) * 100;
            fill.style.width = (x + 40) + 'px'; // +40 to cover behind the knob center
            
            // Color Transition: Red (0deg hue) to Green (120deg hue)
            // Note: --primary is Red. We simulate transition via hue-rotate or just CSS var
            // Simple approach: Use linear gradient update or class change near end
            
            // Fade Text
            text.style.opacity = 1 - (pct / 80);

            // Trigger Complete
            if(x >= max - 5) {
                completeBooking();
                isDragging = false;
            }
        }

        function endDrag() {
            if(!isDragging) return;
            isDragging = false;
            // Snap back
            knob.style.transition = '0.3s';
            knob.style.left = '5px';
            fill.style.transition = '0.3s';
            fill.style.width = '0px';
            text.style.opacity = 1;
        }

        function completeBooking() {
            // Success State
            fill.style.width = '100%';
            fill.style.background = 'var(--success)';
            knob.style.left = (track.offsetWidth - knob.offsetWidth - 5) + 'px';
            knob.style.background = 'var(--success)';
            icon.innerText = 'check';
            icon.style.color = 'black';
            
            if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
            
            setTimeout(() => {
                document.getElementById('success').classList.add('show');
            }, 300);
        }
    </script>

</body>
</html>
