<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cravity - Access</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. THEME --- */
        :root {
            --bg: #000;
            --primary: #FF3F3F;
            --neon-blue: #00F0FF;
            --glass: rgba(15, 15, 15, 0.9);
            --border: rgba(255, 255, 255, 0.15);
            --text: #FFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #000; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text);
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 414px; height: 100%; position: relative;
            background: radial-gradient(circle at 50% 100%, #1a0505 0%, #000 80%);
            display: flex; flex-direction: column; justify-content: center; padding: 30px;
        }

        /* Background Grid */
        .grid-bg {
            position: absolute; inset: 0; opacity: 0.2; pointer-events: none;
            background-image: linear-gradient(rgba(255, 63, 63, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 63, 63, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle, black 30%, transparent 80%);
        }

        /* --- 2. LOGO SECTION --- */
        .brand-section { text-align: center; margin-bottom: 50px; position: relative; z-index: 2; }
        .logo-glitch {
            font-family: 'JetBrains Mono'; font-weight: 800; font-size: 42px; letter-spacing: -2px;
            color: white; position: relative; display: inline-block;
            text-shadow: 2px 2px 0px var(--primary), -2px -2px 0px var(--neon-blue);
            animation: twitch 3s infinite;
        }
        .tagline { font-size: 12px; color: #888; letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; }

        /* --- 3. FORM INPUTS --- */
        .login-form { width: 100%; position: relative; z-index: 2; }
        
        .input-box { position: relative; margin-bottom: 25px; }
        
        .t-input {
            width: 100%; background: transparent; border: none; border-bottom: 1px solid #333;
            padding: 15px 40px 15px 5px; color: white; font-size: 16px; outline: none;
            font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s;
        }
        .t-input:focus { border-bottom-color: var(--primary); }
        
        /* Floating Label */
        .t-label {
            position: absolute; left: 5px; top: 15px; color: #666; font-size: 14px;
            transition: 0.3s; pointer-events: none; font-family: 'JetBrains Mono';
        }
        .t-input:focus ~ .t-label,
        .t-input:not(:placeholder-shown) ~ .t-label {
            top: -10px; font-size: 10px; color: var(--primary);
        }

        .input-icon {
            position: absolute; right: 0; top: 15px; color: #444; font-size: 20px; transition: 0.3s;
        }
        .t-input:focus ~ .input-icon { color: var(--text); }

        /* --- 4. ACTIONS --- */
        .action-row {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px;
        }
        .bio-btn {
            width: 50px; height: 50px; border-radius: 15px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--neon-blue); transition: 0.3s;
        }
        .bio-btn:active { transform: scale(0.9); border-color: var(--neon-blue); background: rgba(0, 240, 255, 0.1); }

        .login-btn {
            flex: 1; margin-left: 15px; height: 50px; border-radius: 15px; border: none;
            background: var(--text); color: black; font-weight: 800; font-size: 14px;
            cursor: pointer; box-shadow: 0 0 20px rgba(255,255,255,0.2); letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s;
        }
        .login-btn:active { transform: scale(0.98); background: var(--primary); color: white; box-shadow: 0 0 30px var(--primary); }

        /* --- 5. FOOTER --- */
        .footer { text-align: center; margin-top: 30px; position: relative; z-index: 2; }
        .signup-link {
            color: #666; font-size: 12px; text-decoration: none;
        }
        .signup-link span { color: var(--text); font-weight: 700; border-bottom: 1px solid var(--primary); }

        /* --- OVERLAYS --- */
        .scan-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .fingerprint {
            font-size: 80px; color: var(--border); animation: scan 1.5s infinite;
        }
        .scan-text { margin-top: 20px; font-family: 'JetBrains Mono'; color: var(--neon-blue); font-size: 12px; }

        @keyframes twitch {
            0% { transform: translate(0,0); }
            2% { transform: translate(2px,0); }
            4% { transform: translate(-2px,0); }
            6% { transform: translate(0,0); }
            100% { transform: translate(0,0); }
        }
        @keyframes scan { 0% { opacity: 0.3; color: #333; } 50% { opacity: 1; color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue); } 100% { opacity: 0.3; color: #333; } }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="grid-bg"></div>

        <div class="brand-section">
            <div class="logo-glitch">CRAVITI</div>
            <div class="tagline">SYSTEM ACCESS</div>
        </div>

        <div class="login-form">
            
            <div class="input-box">
                <input type="email" class="t-input" id="email" placeholder=" " required>
                <label class="t-label">IDENTITY</label>
                <span class="material-icons-round input-icon">person</span>
            </div>

            <div class="input-box">
                <input type="password" class="t-input" id="password" placeholder=" " required>
                <label class="t-label">PASSWORD</label>
                <span class="material-icons-round input-icon">lock</span>
            </div>

            <div class="action-row">
                <div class="bio-btn" onclick="biometricLogin()">
                    <span class="material-icons-round" style="font-size:28px;">fingerprint</span>
                </div>
                <button class="login-btn" onclick="login()">
                    ENTER <span class="material-icons-round">arrow_forward</span>
                </button>
            </div>

        </div>

        <div class="footer">
            <a href="signup.html" class="signup-link">NEW USER? <span>ESTABLISH LINK</span></a>
            <br><br>
            <a href="forgot-password.html" class="signup-link" style="opacity:0.5">RECOVER ACCESS</a>
        </div>

        <div class="scan-overlay" id="bio-scan">
            <span class="material-icons-round fingerprint">fingerprint</span>
            <div class="scan-text">VERIFYING BIOMETRICS...</div>
        </div>

    </div>

    <script>
        function login() {
            const btn = document.querySelector('.login-btn');
            const email = document.getElementById('email').value;
            
            if(navigator.vibrate) navigator.vibrate(20);
            
            btn.innerHTML = "AUTHENTICATING...";
            btn.style.opacity = "0.7";

            setTimeout(() => {
                window.location.href = 'home.html';
            }, 1500);
        }

        function biometricLogin() {
            if(navigator.vibrate) navigator.vibrate(50);
            
            const overlay = document.getElementById('bio-scan');
            overlay.style.display = 'flex';
            
            setTimeout(() => {
                overlay.innerHTML = '<span class="material-icons-round" style="font-size:80px; color:#00E676; text-shadow:0 0 30px #00E676;">check_circle</span><div class="scan-text" style="color:#00E676">ACCESS GRANTED</div>';
                if(navigator.vibrate) navigator.vibrate([50, 50]);
            }, 1500);

            setTimeout(() => {
                window.location.href = 'home.html';
            }, 2500);
        }
    </script>

</body>
</html>
